
name: Build G-face APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Extraire le projet
        run: unzip -o gface.zip -d .

      - name: Insérer les clés Firebase
        run: cp firebase-config-real.js gface/www/js/firebase-config.js

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dépendances npm
        working-directory: gface
        run: npm install

      - name: Ajouter la plateforme Android
        working-directory: gface
        run: npx cap add android

      - name: Copier le code web dans Android
        working-directory: gface
        run: npx cap copy android

      - name: Rendre gradlew exécutable
        run: chmod +x gface/android/gradlew

      - name: Construire l'APK
        working-directory: gface/android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: gface-apk
          path: gface/android/app/build/outputs/apk/debug/app-debug.apk
